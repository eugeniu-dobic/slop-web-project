<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRUTH</title>
  <style>
    /* ==========================================================================
       ULTRA-MINIMAL BRUTALIST MONOCHROME TERMINAL THEME
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: "Courier New", Courier, monospace;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body.selection-allowed {
      user-select: text;
      -webkit-user-select: text;
    }

    /* Screen container */
    .stage {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      padding: 24px 16px;
    }

    .stage.terminal-mode {
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 120px 16px;
    }

    /* Buttons container */
    .button-group {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 48px;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .button-group.dissolving {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
    }

    /* Pure monochrome brutalist buttons */
    .brutalist-btn {
      appearance: none;
      -webkit-appearance: none;
      background-color: #000000;
      color: #ffffff;
      border: 1.5px solid #ffffff;
      border-radius: 0;
      padding: 18px 36px;
      font-family: "Courier New", Courier, monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      cursor: pointer;
      outline: none;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease;
      position: relative;
    }

    .brutalist-btn:hover {
      background-color: #ffffff;
      color: #000000;
    }

    .brutalist-btn:active {
      transform: scale(0.98);
    }

    .brutalist-btn:focus-visible {
      box-shadow: 0 0 0 2px #000000, 0 0 0 4px #ffffff;
    }

    /* Dramatic screen flicker & glitch overlay */
    .glitch-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      background: #ffffff;
      opacity: 0;
      z-index: 9999;
    }

    .flicker-active {
      animation: brutalistGlitch 0.45s steps(2, start) forwards;
    }

    @keyframes brutalistGlitch {
      0% { opacity: 0; }
      10% { opacity: 0.9; }
      20% { opacity: 0.05; }
      35% { opacity: 0.7; }
      50% { opacity: 0; }
      65% { opacity: 0.85; }
      80% { opacity: 0.1; }
      100% { opacity: 0; }
    }

    /* Typewriter terminal reveal container */
    .truth-container {
      display: none;
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
      text-align: left;
      animation: terminalFadeIn 0.4s ease-out;
    }

    .truth-container.active {
      display: block;
    }

    @keyframes terminalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .truth-feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .truth-line {
      font-size: 16px;
      line-height: 1.75;
      letter-spacing: 0.8px;
      color: #ffffff;
      word-break: break-word;
    }

    .truth-cursor {
      display: inline-block;
      width: 10px;
      color: #ffffff;
      animation: cursorBlink 0.8s infinite;
      font-weight: 700;
      margin-left: 2px;
    }

    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    /* ==========================================================================
       CUSTOM LINK STYLING (YELLOW LINKS & VIOLET DOWNLOAD)
       ========================================================================== */
    .truth-link-yellow {
      color: #ffe600 !important;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255, 230, 0, 0.6);
      cursor: pointer;
      transition: color 0.15s ease, text-shadow 0.15s ease;
    }

    .truth-link-yellow:hover {
      color: #fff488 !important;
      text-shadow: 0 0 14px rgba(255, 230, 0, 0.95);
    }

    .truth-download-violet {
      color: #bf55ec !important;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: bold;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(191, 85, 236, 0.6);
      cursor: pointer;
      transition: color 0.15s ease, text-shadow 0.15s ease;
    }

    .truth-download-violet:hover {
      color: #e295fc !important;
      text-shadow: 0 0 14px rgba(191, 85, 236, 0.95);
    }

    /* Mobile responsiveness */
    @media (max-width: 680px) {
      .button-group {
        flex-direction: column;
        gap: 24px;
        width: 85%;
      }

      .brutalist-btn {
        width: 100%;
        text-align: center;
        padding: 16px 20px;
        font-size: 13px;
        letter-spacing: 2px;
      }

      .truth-line {
        font-size: 14.5px;
        line-height: 1.65;
      }
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- Action buttons -->
    <div class="button-group" id="button-group">
      <button class="brutalist-btn" id="btn-doomscroll" type="button">keep doomscrolling</button>
      <button class="brutalist-btn" id="btn-truth" type="button">get the truth</button>
    </div>

    <!-- Glitch flash effect layer -->
    <div class="glitch-flash" id="glitch-flash" aria-hidden="true"></div>

    <!-- Typewriter terminal reveal -->
    <main class="truth-container" id="truth-container" aria-live="polite">
      <div class="truth-feed" id="truth-feed"></div>
    </main>
  </div>

  <script>
    (function () {
      const btnDoomscroll = document.getElementById('btn-doomscroll');
      const btnTruth = document.getElementById('btn-truth');
      const buttonGroup = document.getElementById('button-group');
      const glitchFlash = document.getElementById('glitch-flash');
      const truthContainer = document.getElementById('truth-container');
      const truthFeed = document.getElementById('truth-feed');
      const stage = document.getElementById('stage');

      let sequenceStarted = false;

      // 1. "keep doomscrolling" action -> reset localStorage & redirect to index.html
      btnDoomscroll.addEventListener('click', () => {
        if (sequenceStarted) return;
        sequenceStarted = true;

        try {
          localStorage.clear();
          sessionStorage.clear();
        } catch (e) { }

        buttonGroup.style.opacity = '0';
        buttonGroup.style.pointerEvents = 'none';

        setTimeout(() => {
          window.location.href = 'index.html';
        }, 180);
      });

      // 2. "get the truth" action -> glitch and typewriter reveal sequence
      btnTruth.addEventListener('click', () => {
        if (sequenceStarted) return;
        sequenceStarted = true;

        // Dissolve buttons
        buttonGroup.classList.add('dissolving');

        setTimeout(() => {
          buttonGroup.style.display = 'none';
          stage.classList.add('terminal-mode');
          document.body.classList.add('selection-allowed');

          // Trigger screen glitch flash
          glitchFlash.classList.add('flicker-active');

          setTimeout(() => {
            glitchFlash.classList.remove('flicker-active');
            truthContainer.classList.add('active');
            runTruthTypewriter();
          }, 450);
        }, 500);
      });

      async function runTruthTypewriter() {
        const scrollToBottom = () => {
          window.scrollTo({
            top: document.documentElement.scrollHeight,
            behavior: 'smooth'
          });
        };

        const typeLine = async (text, speed = 46, fastPunctuation = false, keepCursor = false) => {
          const lineEl = document.createElement('div');
          lineEl.className = 'truth-line';

          const textSpan = document.createElement('span');
          const cursorSpan = document.createElement('span');
          cursorSpan.className = 'truth-cursor';
          cursorSpan.textContent = '_';

          lineEl.appendChild(textSpan);
          lineEl.appendChild(cursorSpan);
          truthFeed.appendChild(lineEl);
          scrollToBottom();

          for (let c = 0; c < text.length; c++) {
            textSpan.textContent += text[c];
            scrollToBottom();
            const delay = fastPunctuation
              ? ((text[c] === '.' || text[c] === '?' || text[c] === '!') ? 35 : (text[c] === ',' ? 20 : speed))
              : ((text[c] === '.' || text[c] === '?' || text[c] === '!') ? 260 : (text[c] === ',' ? 150 : speed));
            await new Promise(r => setTimeout(r, delay));
          }

          if (!keepCursor) {
            cursorSpan.remove();
          }
          return { lineEl, cursorSpan };
        };

        // --- STEP 1: INTRO LINE ---
        await typeLine("You have reached the end of the feed.", 50);
        await new Promise(r => setTimeout(r, 800));

        // --- STEP 2: THEODORE KACZYNSKI QUOTE BLOCK (Appears very fast via typewriter, then waits 25s) ---
        await typeLine("“Today, people live less by what they do for themselves and more by what the system does for them and to them. What does not fit the system can be treated as a sickness, and the manipulation of the individual can be presented as a cure.", 11, true);
        await new Promise(r => setTimeout(r, 180));

        await typeLine("The system does not need to force obedience. It only needs to make itself necessary. Once dependence becomes normal, control no longer has to announce itself. It becomes part of everyday life, until people can no longer imagine living without it.”", 11, true);
        await new Promise(r => setTimeout(r, 180));

        const authorResult = await typeLine(" ― Theodore Kaczynski", 14, true, true);

        // Wait 25 seconds before continuing (skippable by click or keypress)
        await new Promise((resolve) => {
          let timeoutId = null;
          let finished = false;

          const complete = () => {
            if (finished) return;
            finished = true;
            if (timeoutId) clearTimeout(timeoutId);
            window.removeEventListener('keydown', skipHandler);
            document.removeEventListener('click', skipHandler);
            if (authorResult && authorResult.cursorSpan) {
              authorResult.cursorSpan.remove();
            }
            resolve();
          };

          const skipHandler = () => {
            complete();
          };

          timeoutId = setTimeout(() => {
            complete();
          }, 25000);

          setTimeout(() => {
            window.addEventListener('keydown', skipHandler, { once: true });
            document.addEventListener('click', skipHandler, { once: true });
          }, 450);
        });

        await new Promise(r => setTimeout(r, 800));

        // --- STEP 3: POST-QUOTE REFLECTION MONOLOGUE ---
        const reflectionLines = [
          "You don't have to agree with him.",
          "But look at the idea.",
          "It doesn't happen all at once. One thing at a time. A little more convenience. A little more information. A little less privacy. A little more dependence.",
          "You clicked. You scrolled. You watched. You came back.",
          "Nothing forced you.",
          "That is what makes it worth looking at.",
          "The Internet was built as a space for communication, participation and freedom. But it became a system built around attention, data and prediction. We are not simply using it anymore. We are living inside it.",
          "So don't take my word for it.",
          "You wanted to know what was behind the screen.",
          "Now you can look.",
          "Do you want to find out more?",
          "Maybe someone I know has something you might find interesting."
        ];

        for (let i = 0; i < reflectionLines.length; i++) {
          await typeLine(reflectionLines[i], 44);
          await new Promise(r => setTimeout(r, 480));
        }

        // --- STEP 4: LINK LINE (domenicoquaranta.com - yellow link) ---
        const linkLineEl = document.createElement('div');
        linkLineEl.className = 'truth-line';
        linkLineEl.innerHTML = `<a href="https://domenicoquaranta.com/" target="_blank" rel="noopener noreferrer" class="truth-link-yellow">https://domenicoquaranta.com/</a>`;
        truthFeed.appendChild(linkLineEl);
        scrollToBottom();

        await new Promise(r => setTimeout(r, 800));

        // --- STEP 5: DIRECTORY TREE VISUALIZATION (plain truth-line without box or border) ---
        const dirBlock = document.createElement('div');
        dirBlock.className = 'truth-line';
        dirBlock.innerHTML = `archive/<br>|-<a href="archive/Industrial-Society-And-Its-Future.pdf" download="Industrial-Society-And-Its-Future.pdf" class="truth-download-violet" title="Download PDF">Industrial-Society-And-Its-Future.pdf</a><br>|<br>|-<a href="https://youtu.be/Yn9BvNAUvcU?si=6P6eyEfOcMjm0Crq" target="_blank" rel="noopener noreferrer" class="truth-link-yellow" title="Open YouTube link">https://youtu.be/Yn9BvNAUvcU?si=6P6eyEfOcMjm0Crq</a>`;
        truthFeed.appendChild(dirBlock);
        scrollToBottom();

        await new Promise(r => setTimeout(r, 500));

        // Final blinking terminal cursor at bottom
        const finalCursorLine = document.createElement('div');
        finalCursorLine.className = 'truth-line';
        finalCursorLine.style.marginTop = '16px';
        finalCursorLine.innerHTML = `<span class="truth-cursor">_</span>`;
        truthFeed.appendChild(finalCursorLine);
        scrollToBottom();
      }
    })();
  </script>
</body>
</html>
